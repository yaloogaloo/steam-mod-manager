[pytest]
testpaths = tests
# Skip operator leftover-GC / one-shot tools; run with: pytest tests/legacy
norecursedirs = .* build dist CVS _darcs {arch} *.egg __pycache__ legacy archive
# Guard against modal/thread hangs in headless runs (was >1h suite stalls).
timeout = 90
timeout_method = thread
markers =
    network: requires outbound network and/or Playwright browser (skipped when unavailable)
    playwright: requires Playwright Chromium installed (skipped when executable missing)
    slow: long-running integration tests
