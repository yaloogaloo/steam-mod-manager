<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' qrc:; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>SMM 资产库</title><style>/*STYLE*/</style></head><body>
<div class="workbench" id="app">
 <nav class="rail" aria-label="主导航"><div class="brand"><span class="brand-mark">S</span><div>SMM<small>MOD WORKBENCH</small></div></div>
 <div class="nav-label">工作台</div><button class="nav-item active" id="library-nav"><span data-icon="grid"></span>资产库</button>
 <div class="nav-label other">其他工作区</div><div class="nav-muted"><span data-icon="layers"></span>部署管理</div><div class="nav-muted"><span data-icon="download"></span>获取与同步</div><div class="nav-muted"><span data-icon="shield"></span>健康检查</div>
 <p class="rail-note">只读预览开放资产浏览。<br>业务操作请使用旧版。</p><div class="rail-bottom"><span class="live-dot"></span>本地资产 · 安全只读<small>WEBENGINE PREVIEW</small></div></nav>
 <main><header class="topbar"><span class="breadcrumb">工作台 <span>/</span> 资产库</span><div class="game-control"><span data-icon="game"></span><select id="game" aria-label="选择游戏"></select></div><span class="mode"><span class="live-dot"></span>只读模式</span></header>
 <section class="page-heading"><div><span class="eyebrow">YOUR MOD LIBRARY</span><h1>资产库</h1><p id="summary">正在连接本地数据库…</p></div><div class="header-actions"><button id="refresh"><span data-icon="refresh"></span>刷新</button><span class="readonly-note">导入与部署在此模式下不可用</span></div></section>
 <div class="browse-tabs" role="tablist"><button class="tab active" data-browse="all">全部资产 <span id="all-count">—</span></button><button class="tab" data-browse="favorite">收藏 <span id="fav-count">—</span></button><button class="tab" data-browse="collections">合集 <span id="collection-count">—</span></button></div>
 <div class="querybar"><div class="search-field"><span data-icon="search"></span><input id="search" placeholder="搜索 Mod 名称或 Workspace ID" aria-label="搜索资产"><button id="clear-search" aria-label="清除搜索">×</button></div><select id="status" aria-label="部署状态"><option value="all">全部状态</option><option value="deployed">已部署</option><option value="undeployed">未部署</option><option value="error">异常 / 缺失</option></select><select id="type" aria-label="类型"><option value="">全部类型</option></select><select id="category" aria-label="分类"><option value="">全部分类</option></select><select id="collection" hidden aria-label="合集"></select><div class="density"><button id="standard" class="active" title="标准密度" aria-label="标准密度"><span data-icon="grid"></span></button><button id="compact" title="紧凑密度" aria-label="紧凑密度"><span data-icon="dense"></span></button></div></div>
 <div class="resultbar"><span id="results" role="status">正在读取资产…</span><span id="selection-tools" hidden><b id="selected-count"></b><button id="select-all">全选结果</button><button id="clear-selection">清除勾选</button></span><span id="browse-hint">单击查看详情 · 勾选框独立选择</span></div>
 <div class="workspace"><div class="viewport" id="viewport" tabindex="0" aria-label="Mod 资产宫格"><div id="grid"></div><div id="empty" hidden><span data-icon="search"></span><h2>没有匹配的资产</h2><p>调整搜索或筛选条件，或者切换游戏。</p><button id="reset-filter">清除筛选</button></div></div><aside id="inspector" hidden aria-label="Mod 详情侧栏"></aside></div>
 <footer class="statusbar"><span id="game-caption">本地数据库</span><span>封面与描述来自现有资产 · 不执行扫描或修复</span></footer>
 </main></div>
<dialog id="detail" aria-label="完整 Mod 详情"><div id="detail-content"></div></dialog>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script><script>/*SCRIPT*/</script></body></html>
